name: geburtstags_app
description: App für Geburtstagerinnerungen
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"
  flutter: 3.27.3

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  build_runner: ^2.4.6
  shared_preferences: ^2.2.1
  
  # riverpod
  flutter_riverpod: ^2.4.1
  riverpod_annotation: ^2.1.6

  # logging
  logging: ^1.1.1
  logging_appenders: ^1.0.2
  uuid: ^4.3.3
  http: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.3.2
  riverpod_lint: ^2.1.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
